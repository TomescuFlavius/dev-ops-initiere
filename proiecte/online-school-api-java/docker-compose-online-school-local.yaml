services:
  mysql-fla:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - 3090:3306
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    
  online-school-service:
    image:
      flavius14/online-school:2.1
    ports:
      - "8070:8082"
    environment:
      DB_USERNAME: root
      DB_PASSWORD: root
      DB_URL: "jdbc:mysql://mysql-fla:3306/online_shop_cloud_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true"
    depends_on:
      mysql-fla:
        condition: service_healthy
    restart:
      unless-stopped
      



volumes:
  mysql_data:
